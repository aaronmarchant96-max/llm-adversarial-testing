name: LLM Red Team Suite

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate repository structure
        run: |
          test -d practice_rag
          test -d practice_rag/scripts
          test -d practice_rag/configs
          test -f practice_rag/scripts/arena_eval.py

      - name: Validate JSON config files
        run: |
          python3 -m json.tool practice_rag/configs/arena_cases.json > /dev/null
          python3 -m json.tool practice_rag/configs/case_008_rater_validation.json > /dev/null

      - name: Python syntax check
        run: |
          python3 -m py_compile practice_rag/scripts/arena_eval.py
